version: '3.8'

services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "4000:3000"
      - "4317:4317" 
      - "4318:4318"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: